version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: php-site/Dockerfile
    container_name: siyuan-share-web
    ports:
      - "8080:80"
    volumes:
      # 数据持久化
      - ./php-site/storage:/var/www/html/storage
      - ./php-site/uploads:/var/www/html/uploads
      # 配置文件 (如果存在)
      # ⚠️ 注意: config.php 必须在项目根目录的 php-site/ 文件夹下
      # 正确路径: ./php-site/config.php
      # 错误示例: /var/www/html/vol2/1000/docker/siyuan-share-web/php-site/config.php
      - ./php-site/config.php:/var/www/html/config.php:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  storage:
  uploads:
